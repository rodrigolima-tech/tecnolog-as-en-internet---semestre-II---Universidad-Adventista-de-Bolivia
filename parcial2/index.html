<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salteñería El Horno</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Salteñería El Horno</h1>
    <p>Salteñas de barrio recien salidas del horno: pides por la página y te las llevamos calentitas a la casa.</p>
  </header>

  <main>
    <form id="form-horno" novalidate method="POST" action="procesar.php">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required>

      <label for="pedido">¿Que salteñas quieres?</label>
      <textarea id="pedido" name="pedido" rows="4" placeholder="Contanos cuantas y de cuál quieres"></textarea>

      <button type="submit">Hacer mi pedido</button>

      <p id="aviso-horno" class="aviso"></p>

    </form>
  </main>

  <footer>
    <p>Parcial 2 - RODRIGO WILDER LIMA CANAVIRI - 20 de octubre de 2026</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
